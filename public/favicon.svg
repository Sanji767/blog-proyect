<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2c1642" />
      <stop offset="50%" stop-color="#1c0f2a" />
      <stop offset="100%" stop-color="#12081d" />
    </linearGradient>

    <!-- Outer Border Glow Gradient -->
    <linearGradient id="border-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#2fb7d1" />
      <stop offset="75%" stop-color="#f8c44c" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- F Glyph Cyan Gradient -->
    <linearGradient id="f-grad" x1="12" y1="12" x2="38" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="50%" stop-color="#2fb7d1" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Growth Surge Gold Gradient -->
    <linearGradient id="arrow-grad" x1="28" y1="38" x2="54" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f8c44c" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>

    <!-- Subtle Inner Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Squircle with Vibrant Dual Border -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="16" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="2.5" />

  <!-- Subtle Ambient Glow -->
  <circle cx="46" cy="18" r="14" fill="#38bdf8" opacity="0.12" filter="blur(6px)" />
  <circle cx="20" cy="44" r="12" fill="#f8c44c" opacity="0.08" filter="blur(6px)" />

  <!-- Vertical Stem of F with subtle chamfer -->
  <path d="M16 16.5C16 14.567 17.567 13 19.5 13H21.5C23.433 13 25 14.567 25 16.5V47.5C25 49.433 23.433 51 21.5 51H19.5C17.567 51 16 49.433 16 47.5V16.5Z" fill="url(#f-grad)" />

  <!-- Top Horizontal Bar of F -->
  <path d="M21 13H38C39.933 13 41.5 14.567 41.5 16.5V17.5C41.5 19.433 39.933 21 38 21H21V13Z" fill="url(#f-grad)" />

  <!-- Middle Horizontal Bar of F -->
  <path d="M21 27.5H32.5C34.433 27.5 36 29.067 36 31V31.5C36 33.433 34.433 35 32.5 35H21V27.5Z" fill="url(#f-grad)" />

  <!-- Dynamic Financial Growth Surge (Upward Trending Arrow & Path) -->
  <path d="M27 46L36 35L44 25L51 17.5" stroke="url(#arrow-grad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M43 16H52V25" stroke="url(#arrow-grad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- EU Stars (Precision Sparkles) -->
  <!-- Star 1 (Main Top Star) -->
  <path d="M51 9L51.8 11.2L54 12L51.8 12.8L51 15L50.2 12.8L48 12L50.2 11.2L51 9Z" fill="#fef08a" />
  <!-- Star 2 (Left Orbit) -->
  <circle cx="42" cy="8.5" r="1.5" fill="#f8c44c" />
  <!-- Star 3 (Right Accent) -->
  <circle cx="56" cy="18" r="1.2" fill="#f8c44c" />
</svg>
